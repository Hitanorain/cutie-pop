<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>萌萌消消乐</title>
<meta name="description" content="萌萌消消乐 Cutie Pop：拖动小萌物三个连一排消掉，连得越快音乐越嗨，还有鼓励语音。">
<meta name="theme-color" content="#ff8fb6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff8fb6'/%3E%3Cellipse cx='22' cy='19' rx='6' ry='13' fill='%23fff'/%3E%3Cellipse cx='42' cy='19' rx='6' ry='13' fill='%23fff'/%3E%3Ccircle cx='32' cy='39' r='19' fill='%23fff'/%3E%3Ccircle cx='25' cy='37' r='3.2' fill='%234a2747'/%3E%3Ccircle cx='39' cy='37' r='3.2' fill='%234a2747'/%3E%3Cellipse cx='20' cy='44' rx='4' ry='2.5' fill='%23ff8fb6'/%3E%3Cellipse cx='44' cy='44' rx='4' ry='2.5' fill='%23ff8fb6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root { --ink: #5a2d55; --pink: #ff5d9e; --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd9ea; }
  body { font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  button { font-family: inherit; cursor: pointer; border: none; color: inherit; background: none; padding: 0; }
  #cv { position: fixed; inset: 0; z-index: 0; touch-action: none; }
  .screen { position: fixed; inset: 0; z-index: 2; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s, visibility 0s .3s; }
  .screen.on { opacity: 1; visibility: visible; transition: opacity .3s; }
  .ui { pointer-events: auto; }

  /* 糖果按钮 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 34px; min-width: 190px; border-radius: 999px;
    font-size: 26px; color: #fff; letter-spacing: .06em; text-shadow: 0 2px 0 rgba(150, 50, 0, .25);
    background: linear-gradient(180deg, #ffe17a 0%, #ffb53c 55%, #ff9a2e 100%);
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), 0 7px 0 #d8701c, 0 12px 24px rgba(120, 40, 20, .25);
    transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(5px); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), 0 2px 0 #d8701c; }
  .btn.pink { background: linear-gradient(180deg, #ff9cc0 0%, #ff6a9c 55%, #ff4f8b 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 7px 0 #c63a6d, 0 12px 24px rgba(120,20,60,.25); }
  .btn.pink:active { box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #c63a6d; }
  .btn.mint { background: linear-gradient(180deg, #8ff0c8 0%, #3fd0a0 55%, #22b989 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 7px 0 #158a64, 0 12px 24px rgba(10,80,60,.25); }
  .btn.mint:active { box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #158a64; }
  .btn.small { font-size: 21px; padding: 10px 26px; min-width: 150px; }
  .rbtn { width: 50px; height: 50px; border-radius: 50%; font-size: 23px; display: inline-flex; align-items: center; justify-content: center; flex: none;
    background: rgba(255, 255, 255, .85); box-shadow: 0 5px 0 rgba(220, 120, 170, .4), 0 8px 18px rgba(90, 30, 70, .15); transition: transform .08s, box-shadow .08s; }
  .rbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(220, 120, 170, .4); }
  .rbtn.off { opacity: .45; filter: grayscale(1); }
  .rbtn svg { width: 25px; height: 25px; fill: none; stroke: #c4508a; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .rbtn.lang { font-size: 19px; color: #c4508a; letter-spacing: .02em; }
  .rbtn.sm { width: 42px; height: 42px; }
  .rbtn.sm svg { width: 21px; height: 21px; }

  /* 首页 */
  #home { position: absolute; left: 14px; top: calc(14px + var(--st)); }
  .tog { position: absolute; right: 14px; top: calc(14px + var(--st)); display: flex; gap: 10px; }
  .tcol { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: calc(70px + var(--st)) 16px calc(28px + var(--sb)); }
  .logo { text-align: center; }
  .logo h1 { margin: 0; font-size: min(80px, 15vw, 12vh); font-weight: normal; letter-spacing: .04em; line-height: 1.15; }
  .logo h1 span { display: inline-block; color: var(--c); -webkit-text-stroke: 4px #fff; paint-order: stroke fill;
    text-shadow: 0 6px 0 var(--d), 0 12px 24px rgba(200, 60, 120, .3); animation: hop 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * .13s); }
  .logo .en { font-size: min(22px, 5vw); color: #ff6fa5; letter-spacing: .35em; margin-top: 2px; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(-12px) rotate(-5deg); } 50% { transform: translateY(0) rotate(3deg); } }
  #parade { flex: 1 1 auto; width: min(760px, 96vw); min-height: 90px; max-height: 260px; }
  .menu { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .best { font-size: 16px; margin-top: -8px; color: #b0507e; min-height: 1em; }
  .ver { position: fixed; bottom: calc(8px + var(--sb)); right: 12px; font-size: 12px; color: rgba(90, 45, 85, .5); font-family: system-ui, sans-serif; }
  @media (max-height: 600px) { .tcol { padding-top: calc(12px + var(--st)); } .menu { gap: 12px; } .btn { padding: 9px 28px; font-size: 22px; } .btn.small { font-size: 18px; padding: 7px 22px; } }

  /* 世界切换 */
  .wtabs { display: flex; gap: 4px; padding: 5px; border-radius: 99px; background: rgba(255, 255, 255, .55); box-shadow: inset 0 2px 4px rgba(150, 50, 100, .12); width: max-content; }
  .wtabs button { padding: 7px 16px; border-radius: 99px; font-size: 18px; color: #b0507e; white-space: nowrap; transition: background .2s, transform .1s; }
  .wtabs button:active { transform: scale(.95); }
  .wtabs button.on { background: #fff; color: #ff5d9e; box-shadow: 0 3px 0 #f5b3cf; }
  #levels .wtabs { margin: 0 auto 16px; }

  /* 选关 */
  .lvwrap { position: absolute; inset: 0; overflow-y: auto; padding: calc(14px + var(--st)) 16px calc(30px + var(--sb)); }
  .lvhead { display: flex; align-items: center; justify-content: space-between; max-width: 640px; margin: 0 auto 18px; }
  .lvhead h2 { margin: 0; font-size: 32px; font-weight: normal; color: #fff; -webkit-text-stroke: 3px var(--pink); paint-order: stroke fill; }
  .lvhead .stot { font-size: 20px; color: #e6a000; background: rgba(255,255,255,.85); padding: 6px 14px; border-radius: 99px; }
  #lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; max-width: 640px; margin: 0 auto; }
  .lv { aspect-ratio: 1; border-radius: 24px; background: linear-gradient(180deg, #fff, #ffe4ef); color: var(--ink);
    box-shadow: 0 6px 0 #f5a6c7, 0 10px 18px rgba(150, 40, 90, .15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .08s; }
  .lv:active { transform: translateY(4px); }
  .lv b { font-size: min(30px, 7vw); font-weight: normal; line-height: 1; }
  .lv i { font-style: normal; font-size: min(14px, 3.4vw); color: #ecd2de; letter-spacing: 1px; }
  .lv i span { color: #ffbd1a; }
  .lv.lock { opacity: .5; filter: grayscale(.7); cursor: default; }
  .lv.cur { background: linear-gradient(180deg, #fff7cf, #ffd56e); box-shadow: 0 6px 0 #e3a23a, 0 10px 18px rgba(150, 90, 20, .2); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }

  /* 游戏界面 */
  #panel { position: absolute; left: 50%; top: calc(8px + var(--st)); transform: translateX(-50%); width: min(620px, calc(100% - 16px));
    padding: 8px 10px 10px; border-radius: 24px; background: rgba(255, 255, 255, .8);
    box-shadow: 0 6px 0 rgba(240, 140, 185, .45), 0 12px 30px rgba(120, 40, 90, .15); display: flex; flex-direction: column; gap: 7px; }
  .prow { display: flex; align-items: center; gap: 10px; }
  #lvName { font-size: 21px; white-space: nowrap; }
  #heat { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
  #heat .hl { font-size: 15px; color: #ff5d9e; }
  .hbar { flex: 1; height: 16px; border-radius: 99px; background: rgba(255, 160, 200, .25); box-shadow: inset 0 2px 3px rgba(150, 50, 100, .2); overflow: hidden; position: relative; }
  #hfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #8fd3ff, #b993ff, #ff8fb6, #ffb44c); transition: width .15s; }
  #heat.fever #hfill { background: linear-gradient(90deg, #ff6b9a, #ffb347, #ffe45c, #7ee081, #6ec6ff, #b28dff, #ff6b9a); background-size: 200% 100%; animation: rainbow .8s linear infinite; }
  @keyframes rainbow { to { background-position: -200% 0; } }
  #tierName { font-size: 15px; min-width: 5em; text-align: right; white-space: nowrap; font-weight: normal; }
  #heat[data-t="3"] #tierName, #heat[data-t="4"] #tierName { color: #ff7a2e; }
  #heat.fever #tierName { color: #ff3d8b; animation: wob .35s ease-in-out infinite alternate; }
  @keyframes wob { from { transform: rotate(-5deg) scale(1); } to { transform: rotate(5deg) scale(1.12); } }
  .stats { display: flex; gap: 8px; }
  .box { background: #fff; border-radius: 16px; padding: 4px 10px 6px; text-align: center; box-shadow: inset 0 -3px 0 rgba(255, 150, 190, .25);
    display: flex; flex-direction: column; justify-content: center; min-width: 66px; }
  .box small { font-size: 13px; opacity: .7; white-space: nowrap; }
  .box b { font-size: 26px; line-height: 1.1; font-weight: normal; }
  .box b.warn { color: #ff3d6e; animation: wob .3s ease-in-out infinite alternate; }
  .box.grow { flex: 1; }
  .sbar { position: relative; height: 9px; border-radius: 99px; background: #ffe3ef; margin: 4px 9px 3px 2px; }
  #sfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #ffd23f, #ff8fb6); transition: width .3s; }
  .sbar em { position: absolute; top: 50%; transform: translate(-50%, -50%); font-style: normal; font-size: 17px; color: #e8cbd9; text-shadow: 0 1px 0 #fff; transition: color .2s, transform .2s; }
  .sbar em.on { color: #ffbd1a; transform: translate(-50%, -50%) scale(1.25); text-shadow: 0 0 6px rgba(255, 200, 0, .8); }
  #goals { display: flex; gap: 8px; justify-content: center; align-items: center; }
  .goal { display: flex; align-items: center; }
  .goal img { width: 34px; height: 34px; }
  .goal b { font-size: 20px; margin-left: -1px; font-weight: normal; }
  .goal.done b { color: #22b37a; }
  /* 道具 */
  .tools { display: flex; gap: 7px; }
  .tool { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; gap: 3px; height: 42px; border-radius: 15px;
    font-size: 15px; white-space: nowrap; background: linear-gradient(180deg, #fff, #ffeef5); box-shadow: 0 4px 0 #f5b3cf, 0 6px 12px rgba(150, 40, 90, .1);
    transition: transform .08s, box-shadow .08s; }
  .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #f5b3cf; }
  .tool .ti { font-size: 22px; line-height: 1; }
  .tool em { position: absolute; top: -7px; right: -5px; min-width: 21px; height: 21px; padding: 0 5px; border-radius: 11px; background: #ff5d9e; color: #fff;
    font-style: normal; font-size: 13px; line-height: 21px; box-shadow: 0 2px 0 #c63a6d; }
  .tool.used { opacity: .4; filter: grayscale(1); }
  .tool.on { background: linear-gradient(180deg, #fff7cf, #ffd56e); box-shadow: 0 4px 0 #e3a23a; animation: wob .35s ease-in-out infinite alternate; }
  @media (max-width: 380px) { .tool .tl { display: none; } .tool .ti { font-size: 25px; } }
  #hud.side .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
  #hud.side #panel { left: 16px; top: 50%; transform: translateY(-50%); width: 250px; padding: 14px; gap: 12px; }
  #hud.side .prow { flex-wrap: wrap; }
  #hud.side #heat { flex-basis: 100%; }
  #hud.side .stats { flex-direction: column; }
  #hud.side .box b { font-size: 32px; }

  /* 鼓励大字 */
  #shout { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 70; pointer-events: none; white-space: nowrap; font-size: min(40px, 10vw); }
  #shout span { display: inline-block; opacity: 0; color: hsl(var(--h), 95%, 62%); -webkit-text-stroke: 5px #fff; paint-order: stroke fill;
    text-shadow: 0 5px 0 rgba(150, 40, 100, .3), 0 0 20px rgba(255, 255, 255, .9); }
  #shout.go span { animation: shoutIn 1.5s cubic-bezier(.3, 1.5, .5, 1) both; }
  #shout.l2 { font-size: min(46px, 11vw); } #shout.l3 { font-size: min(52px, 12vw); } #shout.l4 { font-size: min(58px, 13vw); } #shout.l5 { font-size: min(66px, 14vw); }
  #shout.l5 span { animation-name: shoutBig; }
  @keyframes shoutIn { 0% { opacity: 0; transform: translateY(30px) scale(.2); } 18% { opacity: 1; transform: translateY(-8px) scale(1.25); } 30% { transform: none; } 78% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-30px) scale(.9); } }
  @keyframes shoutBig { 0% { opacity: 0; transform: scale(.2) rotate(-20deg); } 15% { opacity: 1; transform: scale(1.4) rotate(8deg); } 25% { transform: scale(1) rotate(-4deg); } 40% { transform: scale(1.1) rotate(3deg); } 55% { transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }

  /* 弹窗 */
  #modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; background: rgba(90, 30, 70, .35);
    opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
  #modal.on { opacity: 1; visibility: visible; transition: opacity .25s; }
  .card { width: min(430px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow: auto; background: #fff; border-radius: 28px; padding: 22px 20px 26px; text-align: center;
    box-shadow: 0 10px 0 #ffc0d8, 0 20px 50px rgba(90, 20, 60, .3); transform: scale(.85); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
  #modal.on .card { transform: scale(1); }
  .card h2 { margin: 0 0 10px; font-size: 34px; font-weight: normal; color: var(--pink); }
  .card p { font-size: 19px; margin: 8px 0; line-height: 1.5; }
  .card p b { color: #ff5d9e; font-weight: normal; }
  #mbtns { display: flex; flex-direction: column; gap: 16px; align-items: center; margin-top: 18px; }
  .mgoals { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 19px; margin: 6px 0; }
  .mgoals img { width: 46px; height: 46px; vertical-align: middle; }
  .rstars { font-size: 60px; letter-spacing: 6px; margin: 4px 0; }
  .rstars span { display: inline-block; color: #f0e2e8; transition: color .2s, transform .3s cubic-bezier(.3, 1.8, .5, 1); transform: scale(.7); }
  .rstars span.on { color: #ffbd1a; transform: scale(1.1); text-shadow: 0 0 14px rgba(255, 190, 0, .7); }
  .bigscore { font-size: 54px !important; color: #ff5d9e; margin: 4px 0 !important; }
  .help { text-align: left; }
  .help p { display: flex; align-items: center; gap: 8px; font-size: 17px; margin: 10px 0; }
  .help img { width: 40px; height: 40px; flex: none; }
  .help .trio { display: flex; flex: none; }
  .help .trio img { width: 30px; height: 30px; margin-right: -4px; }
  .togrow { display: flex; justify-content: center; gap: 14px; margin: 8px 0 2px; }
  .togrow label { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; }
  #safe { position: fixed; bottom: 0; width: 0; height: env(safe-area-inset-bottom, 0px); pointer-events: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<section id="title" class="screen on">
  <a class="rbtn ui" id="home" href="https://hitanorain.github.io/" aria-label="回到游戏厅" title="回到游戏厅"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
  <div class="tog ui">
    <button class="rbtn" data-tog="music" aria-label="背景音乐" title="背景音乐">🎵</button>
    <button class="rbtn" data-tog="sfx" aria-label="音效" title="音效">🔔</button>
    <button class="rbtn" data-tog="voice" aria-label="鼓励语音" title="鼓励语音">💬</button>
    <button class="rbtn lang" data-lang aria-label="语音语言" title="语音语言：中文 / English">中</button>
  </div>
  <div class="tcol">
    <div class="logo" aria-label="萌萌消消乐">
      <h1><span style="--i:0;--c:#ff6fa5;--d:#d23f7a">萌</span><span style="--i:1;--c:#ffb02e;--d:#d07a00">萌</span><span style="--i:2;--c:#4cc4ff;--d:#1f86c9">消</span><span style="--i:3;--c:#6fd65a;--d:#3a9d32">消</span><span style="--i:4;--c:#b47cff;--d:#7a45d0">乐</span></h1>
      <div class="en">CUTIE POP</div>
    </div>
    <div id="parade"></div>
    <div class="menu ui">
      <div class="wtabs"><button data-world="pets">🐰 萌宠乐园</button><button data-world="fruit">🍓 水果乐园</button></div>
      <button class="btn pink" id="bLevels">闯关模式</button>
      <button class="btn" id="bTimed">60 秒挑战</button>
      <div class="best" id="bestLbl"></div>
      <button class="btn mint small" id="bHelp">怎么玩</button>
    </div>
  </div>
  <div class="ver" id="ver"></div>
</section>

<section id="levels" class="screen">
  <div class="lvwrap ui">
    <div class="lvhead">
      <button class="rbtn" id="lvBack" aria-label="返回首页" title="返回首页"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
      <h2>选择关卡</h2>
      <div class="stot" id="starTotal">★ 0</div>
    </div>
    <div class="wtabs"><button data-world="pets">🐰 萌宠乐园</button><button data-world="fruit">🍓 水果乐园</button></div>
    <div id="lvgrid"></div>
  </div>
</section>

<section id="hud" class="screen">
  <div id="panel" class="ui">
    <div class="prow">
      <button class="rbtn sm" id="bPause" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
      <div id="lvName">第 1 关</div>
      <div id="heat"><span class="hl">萌力</span><div class="hbar"><i id="hfill"></i></div><b id="tierName"></b></div>
    </div>
    <div class="stats">
      <div class="box"><small id="movesLbl">步数</small><b id="moves">0</b></div>
      <div class="box grow"><small id="scoreLbl">分数</small><b id="score">0</b>
        <div class="sbar" id="sbar"><i id="sfill"></i><em style="left:45.45%">★</em><em style="left:72.73%">★</em><em style="left:100%">★</em></div></div>
      <div class="box" id="goalBox"><small>收集</small><div id="goals"></div></div>
    </div>
    <div class="tools" id="tools"></div>
  </div>
</section>

<div id="shout"></div>
<div id="modal"><div class="card ui"><div id="mbody"></div><div id="mbtns"></div></div></div>
<div id="safe"></div>

<script>
'use strict';
const VERSION = 'v1.3';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = n => Math.floor(Math.random() * n);
const R = 8, C = 8, LEVELS = 30;

const SAVE_KEY = 'cutie-pop-v1';
const save = { stars: {}, bests: {}, world: 'pets', music: true, sfx: true, voice: true, lang: 'zh', seenHelp: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
if (save.best) { save.bests.pets = Math.max(save.bests.pets || 0, save.best); delete save.best; } // v1.2 以前只有一个 60 秒纪录，算在萌宠乐园
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// 鼓励语音台词，中文和英文两套。tools/make-voice.ps1 读这张表生成 voice/<语言>/<分组>-<序号>.mp3，改了台词要重新生成。
// VOICE-BEGIN
const VOICE = {
  "zh": {
    "start": ["开始啦！", "准备好了吗？出发！"],

// 一簇叶子：从 (cx, cy) 向 angles 各个方向长出去
function leaves(x, cx, cy, angles, len, w = 5.5) {
  for (const a of angles) {
    x.save(); x.translate(cx + Math.cos(a) * len * .5, cy + Math.sin(a) * len * .5); x.rotate(a);
    x.beginPath(); x.ellipse(0, 0, len * .55, w, 0, 0, TAU);
    x.fillStyle = '#62d16b'; x.fill(); x.strokeStyle = '#38a046'; x.lineWidth = 2.2; x.stroke(); x.restore();
  }
}
// 水果乐园的萌物，返回高光位置
function drawFruit(x, k, K, grad, fs) {

      x.beginPath(); x.arc(0, 8, 37, 0, TAU); fs(grad(0, 8, 37));

      leaves(x, 2, -30, [-.45], 24, 6);
      smile(x, 0, 19, 6); return [-15, -12];
    case 2: // 柠檬：横着的椭圆，两头小尖
      for (const s of [-1, 1]) { x.beginPath(); x.ellipse(s * 40, 8, 8, 5.5, 0, 0, TAU); fs(K.c, 2.6); }
      x.beginPath(); x.ellipse(0, 8, 41, 31, 0, 0, TAU); fs(grad(0, 8, 40));
      leaves(x, -2, -21, [-2.5], 22, 6);
      mouthW(x, 0, 18); return [-20, -6];
    case 3: { // 西瓜：圆滚滚的绿西瓜，两边深色花纹
      x.beginPath(); x.arc(0, 8, 37, 0, TAU); x.fillStyle = grad(0, 8, 37); x.fill();

      for (const [gx, gy] of [[-24, -16], [0, -22], [24, -16], [-31, 8], [31, 8], [-19, 32], [19, 32], [0, 41]]) grape(gx, gy, 13);

}

function drawEyes(x, k, lx, ly, blink, happy) {
  const [ex, ey, er] = EYES[k < 0 ? 6 : k];
  x.fillStyle = INK; x.strokeStyle = INK; x.lineWidth = 2.8; x.lineCap = 'round';
  for (const s of [-1, 1]) {
    const cx = s * ex, cy = ey;
    if (happy) { x.beginPath(); x.arc(cx, cy + er * .5, er * .85, Math.PI * 1.15, Math.PI * 1.85); x.stroke(); continue; }
    if (blink) { x.beginPath(); x.moveTo(cx - er * .8, cy); x.quadraticCurveTo(cx, cy + er * .6, cx + er * .8, cy); x.stroke(); continue; }
    const px = cx + lx * er * .3, py = cy + ly * er * .3;
    x.fillStyle = INK; x.beginPath(); x.ellipse(px, py, er * .9, er * 1.08, 0, 0, TAU); x.fill();
    x.fillStyle = '#fff';
    x.beginPath(); x.arc(px - er * .32, py - er * .4, er * .36, 0, TAU); x.fill();
    x.beginPath(); x.arc(px + er * .3, py + er * .38, er * .16, 0, TAU); x.fill();
  }
}

let SPR = [], sprPx = 0;
function makeSprites(px) {

}

// 画一个萌物（含特殊效果）。sp：1 横向火箭 2 竖向火箭 3 泡泡炸弹 4 彩虹星
function drawTile(x, t, px, py, cell, o = {}) {

    let lx = 0, ly = 0;
    if (pointer.on) { const dx = pointer.x - px, dy = pointer.y - py, d = Math.hypot(dx, dy) || 1, f = Math.min(1, d / (CELL * 2)); lx = dx / d * f; ly = dy / d * f; }
    const o = { sc, sx, sy, rot, lx, ly, blink: clock > t.blinkAt, happy };
    if (t.y < colTop[c] - .001) { // 新掉下来的，只在本列格子范围里露出来
      ctx.save(); ctx.beginPath(); ctx.rect(BX + c * CELL - CELL * .3, BY + colTop[c] * CELL - 4, CELL * 1.6, (colBot[c] - colTop[c] + 1) * CELL + CELL * .5); ctx.clip();
      drawTile(ctx, t, px, py, CELL, o); ctx.restore();
    } else drawTile(ctx, t, px, py, CELL, o);
  }
  for (const d of dying) {
    const p = (clock - d.t0) / 260, sc = p < .3 ? 1 + p : 1.3 * (1 - (p - .3) / .7);
    drawTile(ctx, d.t, BX + (d.t.x + .5) * CELL, BY + (d.t.y + .5) * CELL, CELL, { sc: Math.max(.01, sc), alpha: 1 - Math.max(0, (p - .5) * 2), happy: true });
  }
  drawFx();
  ctx.restore();
}
function drawFx() {
  for (const f of fxs) {
    const p = (clock - f.t0) / f.dur; if (p >= 1 || p < 0) continue;
    if (f.type === 'row' || f.type === 'col') {
      const row = f.type === 'row', mid = row ? BY + (f.r + .5) * CELL : BX + (f.c + .5) * CELL, w = CELL * (1 - p) * .9, len = (row ? C : R) * CELL + 40;
      const g = row ? ctx.createLinearGradient(0, mid - w / 2, 0, mid + w / 2) : ctx.createLinearGradient(mid - w / 2, 0, mid + w / 2, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, `rgba(255,255,255,${1 - p})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      if (row) ctx.fillRect(BX - 20, mid - w / 2, len, w); else ctx.fillRect(mid - w / 2, BY - 20, w, len);
      ctx.fillStyle = `rgba(255,120,180,${(1 - p) * .9})`;
      if (row) ctx.fillRect(BX - 20, mid - 2, len, 4); else ctx.fillRect(mid - 2, BY - 20, 4, len);
    } else if (f.type === 'ring') {
      ctx.strokeStyle = `rgba(255,205,70,${1 - p})`; ctx.lineWidth = CELL * .35 * (1 - p) + 1;
      ctx.beginPath(); ctx.arc(BX + (f.c + .5) * CELL, BY + (f.r + .5) * CELL, CELL * (.4 + (f.big ? 3.4 : 2.1) * easeOut(p)), 0, TAU); ctx.stroke();
    } else if (f.type === 'bolt') {
      const x1 = BX + (f.c1 + .5) * CELL, y1 = BY + (f.r1 + .5) * CELL, x2 = BX + (f.c2 + .5) * CELL, y2 = BY + (f.r2 + .5) * CELL;
      const nx = -(y2 - y1), ny = x2 - x1, nl = Math.hypot(nx, ny) || 1;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      for (let i = 1; i < 6; i++) { const q = i / 6, j = rand(-1, 1) * CELL * .25; ctx.lineTo(x1 + (x2 - x1) * q + nx / nl * j, y1 + (y2 - y1) * q + ny / nl * j); }
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = `hsla(${f.hue},100%,70%,${1 - p})`; ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${1 - p})`; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (f.type === 'hammer') { // 锤子从右上方抡下来敲一下，再弹开淡出
      const sw = p < .45 ? easeInOut(p / .45) : 1, rot = -1.1 + 1.4 * sw - (p > .45 ? .25 * Math.sin((p - .45) * 12) * (1 - p) : 0);
      ctx.save(); ctx.globalAlpha = p > .7 ? 1 - (p - .7) / .3 : 1;
      ctx.translate(BX + (f.c + 1.05) * CELL, BY + (f.r + 1.0) * CELL); ctx.rotate(rot);
      ctx.font = `${CELL * 1.1}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.scale(-1, 1); ctx.fillStyle = '#000'; ctx.fillText('🔨', CELL * .35, -CELL * .55); // 填充色的透明度会作用到 emoji 上，先设成不透明
      ctx.restore();
    } else if (f.type === 'flash') {
      ctx.fillStyle = `rgba(255,255,255,${(1 - p) * .7})`; ctx.fillRect(-50, -50, W + 100, H + 100);
    }
  }
}
function drawParticles() {
  for (const p of parts) {
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
    if (p.shape === 0) { heartPath(ctx, 0, 0, p.size * .8); ctx.fill(); }
    else if (p.shape === 1) { starPath(ctx, 0, 0, p.size, p.size * .45); ctx.fill(); }
    else if (p.shape === 2) { ctx.beginPath(); ctx.arc(0, 0, p.size * .55, 0, TAU); ctx.fill(); }
    else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    ctx.restore();
  }
  for (const f of floats) {
    const p = (clock - f.t0) / f.dur, s = p < .15 ? .5 + p / .15 * .6 : 1.1 - Math.min(.1, (p - .15));
    ctx.save(); ctx.globalAlpha = 1 - Math.pow(p, 3); ctx.translate(f.x, f.y - p * 46); ctx.scale(s, s);
    ctx.font = `${f.size}px "ZCOOL KuaiLe", "PingFang SC", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round'; ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0);
    ctx.restore();
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const running = !(G && G.paused && screen === 'game');
  if (running) { clock += dt * 1000; update(dt); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBg(running ? dt : 0);
  if (screen === 'title') drawParade(dt);
  if (screen === 'game' && G) drawBoard();
  drawParticles();
  requestAnimationFrame(frame);
}

// ===== 输入：鼠标或手指按住一个萌物往旁边拖；也可以先点一个再点旁边的 =====
function hitCell(x, y) {
  const c = Math.floor((x - BX) / CELL), r = Math.floor((y - BY) / CELL);
  return r >= 0 && r < R && c >= 0 && c < C && mask[r][c] ? [r, c] : null;
}
cv.addEventListener('pointerdown', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true;
  if (screen === 'title') {
    for (const p of parade) if (Math.hypot(e.clientX - p.x, e.clientY - (p.y - p.jump)) < PCELL * .55 && p.jump === 0) {
      p.jv = 700; p.jump = .01; Snd.sfx('pop', p.k + 2); popParts(p.x, p.y, p.k);
    }
    return;
  }
  if (screen !== 'game' || !G || G.over || G.paused) return;
  const cell = hitCell(e.clientX, e.clientY);
  if (G.tool) { if (cell) useToolAt(cell[0], cell[1]); return; }
  if (!cell) { sel = null; return; }
  G.idleT = clock; G.hint = null;
  if (sel && Math.abs(sel[0] - cell[0]) + Math.abs(sel[1] - cell[1]) === 1) { const a = sel; sel = null; trySwap(a[0], a[1], cell[0], cell[1]); return; }
  if (G.busy || !grid[cell[0]][cell[1]]) return;
  sel = cell; Snd.sfx('tap');
  drag = { x: e.clientX, y: e.clientY, cell, id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true;
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < CELL * .3) return;
  const [r, c] = drag.cell;
  let r2 = r, c2 = c;
  if (Math.abs(dx) > Math.abs(dy)) c2 += Math.sign(dx); else r2 += Math.sign(dy);
  drag = null; sel = null;
  trySwap(r, c, r2, c2);
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointer.on = false; });

document.addEventListener('pointerdown', () => Snd.unlock(), true);
document.addEventListener('keydown', e => {
  Snd.unlock();
  if (e.key !== 'Escape') return;
  if (G && G.tool) { G.tool = null; updateTools(); } else pause();
});
$('tools').onclick = e => { const b = e.target.closest('.tool'); if (b) pickTool(b.dataset.tool); };
document.addEventListener('click', e => {
  const wb = e.target.closest('[data-world]'); if (wb) { pickWorld(wb.dataset.world); return; }
  if (e.target.closest('[data-lang]')) { // 中文 ⇄ English，切换后马上说一句听听
    save.lang = save.lang === 'zh' ? 'en' : 'zh'; save.voice = true; persist(); refreshToggles();
    if (window.speechSynthesis) speechSynthesis.cancel();
    Voice.loadLang(save.lang);
    setTimeout(() => Voice.play('t1', 0), 250);
    return;
  }
  const b = e.target.closest('[data-tog]'); if (!b) return;
  const k = b.dataset.tog; save[k] = !save[k]; persist(); refreshToggles();
  if (k === 'music') Snd.setMusic(save.music);
  if (k === 'sfx') { Snd.setSfx(save.sfx); Snd.sfx('tap'); }
  if (k === 'voice' && !save.voice && window.speechSynthesis) speechSynthesis.cancel();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); Snd.suspend(); } else Snd.resume();
});
$('bLevels').onclick = () => { Snd.sfx('tap'); show('levels'); };
$('bTimed').onclick = () => { Snd.sfx('tap'); startTimed(); };
$('bHelp').onclick = () => { Snd.sfx('tap'); showHelp(null); };
$('lvBack').onclick = () => { Snd.sfx('tap'); show('title'); };
$('bPause').onclick = () => { Snd.sfx('tap'); pause(); };
$('lvgrid').onclick = e => { const b = e.target.closest('.lv'); if (!b || b.disabled) return; Snd.sfx('tap'); startLevel(+b.dataset.l); };
addEventListener('resize', layout);
if (document.fonts) document.fonts.ready.then(layout);

$('ver').textContent = VERSION;
refreshToggles();
show('title');
requestAnimationFrame(frame);
</script>
</body>
